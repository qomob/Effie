name: Feature Request
description: 提出能力改进或新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目优先保证证据边界与可复现性，而不是增加功能数量。请说明需求如何帮助真实报奖场景。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪个工作流或脚本无法满足需求
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期输入、输出与判定方式
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 脚本与确定性校验
        - 工作流文档
        - 规则知识库
        - 模板与交付物
        - 文档与工程基础设施
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或替代做法
    validations:
      required: false
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该需求不会引入自动提交、代付款或获奖预测
          required: true
        - label: 该需求不需要上传真实客户数据到第三方服务
          required: true
